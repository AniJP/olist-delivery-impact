[project]
name = "olist-delivery-impact"
version = "0.1.0"
description = "How should a marketplace set delivery promises? Causal + predictive analysis of Olist orders."
requires-python = ">=3.10"
dependencies = [
  "dbt-core>=1.10.5,<2.0",
  "dbt-duckdb>=1.9.2",
  "duckdb>=1.1",
  "pandas>=2",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

# Not a Python package: scripts/ and transform/ are run directly, nothing to install.
[tool.setuptools]
packages = []

[project.optional-dependencies]
analysis = ["numpy", "scipy", "statsmodels", "scikit-learn", "lightgbm", "matplotlib", "seaborn", "jupyterlab"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
