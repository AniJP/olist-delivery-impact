name: olist
version: "0.1.0"
config-version: 2
profile: olist

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Orders after August 2018 are a handful of stragglers; analysis windows end here.
  analysis_end_date: "2018-08-31"
  # Customers need this many days of follow-up before their repeat-purchase outcome is known.
  repeat_window_days: 180

models:
  olist:
    staging:
      +schema: staging
      +materialized: table
    intermediate:
      +schema: intermediate
      +materialized: table
    marts:
      +schema: marts
      +materialized: table

seeds:
  olist:
    +schema: reference
